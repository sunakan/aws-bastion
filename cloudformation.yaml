AWSTemplateFormatVersion: '2010-09-09'
Description: Development bastion EC2 (Ubuntu arm64) accessible via SSM Session Manager

Parameters:
  MyIp:
    Type: String
    Description: IPv4 CIDR allowed to access the bastion instance
    AllowedPattern: '^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(\/([0-9]|[1-2][0-9]|3[0-2]))$'
    ConstraintDescription: Must be a valid IPv4 CIDR such as 203.0.113.10/32

  # t4g.small:  2vCPU, 2GiB, $0.0216/時間, 2026年12月31日まで、750時間/月無料
  # t4g.medium: 2vCPU, 4GiB, $0.0432/時間 → 8時間:56円、16時間:112円
  # + IPv4($0.005/時間 → 8時間:7円、16時間14円)
  # + EBS(gp3)($0.096/GB・月 → $0.0001333333/GB・時間 → 20GB・8時間:4円、16時間:8円)
  InstanceType:
    Type: String
    Description: EC2 instance type for the bastion
    Default: t4g.small
    AllowedValues:
      - t4g.small
      - t4g.medium

  # aws ssm get-parameters --names "/aws/service/canonical/ubuntu/server/26.04/stable/current/arm64/hvm/ebs-gp3/ami-id" --region ap-northeast-1 --query "Parameters[0].Value" --output text
  AmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Description: Latest Ubuntu 26.04 LTS arm64 AMI resolved via SSM public parameter
    Default: /aws/service/canonical/ubuntu/server/26.04/stable/current/arm64/hvm/ebs-gp3/ami-id

  # AMIのルートスナップショットが8GiBのためそれ未満は指定できない
  RootVolumeSize:
    Type: Number
    Description: Root EBS volume size in GiB
    Default: 20
    MinValue: 8
    MaxValue: 1024

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      MapPublicIpOnLaunch: true

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow all inbound traffic from the configured IPv4 CIDR
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: All traffic from the configured IPv4 CIDR
          IpProtocol: -1
          CidrIp: !Ref MyIp

  # SSM Session Manager経由の接続のみを想定しているためキーペアは作成しない
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  BastionInstance:
    Type: AWS::EC2::Instance
    DependsOn: DefaultPublicRoute
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref InstanceSecurityGroup
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: !Ref RootVolumeSize
            VolumeType: gp3
            Encrypted: true
      MetadataOptions:
        HttpTokens: required
      Tags:
        - Key: Name
          Value: dev-bastion
      UserData:
        Fn::Base64: |
          #!/bin/bash
          set -euxo pipefail

          apt-get update
          apt-get install -y ca-certificates curl neovim

          # convenience script(get.docker.com)はスクリプト自体の署名/チェックサム検証がなく
          # 公式ドキュメントでも開発/テスト環境限定の推奨のため、本番同様に扱えるAPTリポジトリ経由でインストールする
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          tee /etc/apt/sources.list.d/docker.sources <<EOF
          Types: deb
          URIs: https://download.docker.com/linux/ubuntu
          Suites: $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}")
          Components: stable
          Architectures: $(dpkg --print-architecture)
          Signed-By: /etc/apt/keyrings/docker.asc
          EOF
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
          usermod -aG docker ubuntu

          # miseはubuntuユーザーのホームにインストールする(root実行だと配置先がずれるため)
          sudo -u ubuntu -i sh -c 'curl -fsSL https://mise.run | sh'
          # mise.runはバイナリ配置のみでPATH設定は行わないため.bashrcに追記する
          echo 'eval "$(~/.local/bin/mise activate bash)"' >> /home/ubuntu/.bashrc

Outputs:
  InstanceId:
    Description: Instance ID of the bastion
    Value: !Ref BastionInstance
  PublicIp:
    Description: Public IPv4 address of the bastion
    Value: !GetAtt BastionInstance.PublicIp
