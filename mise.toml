[env]
AWS_REGION = "ap-northeast-1"
BASTION_STACK_NAME = "aws-bastion"

[tasks.hello]
description = "hello"
run = "echo hello"

[tasks.up-bastion]
description = "bastion stackをタイムスタンプ付きの名前で起動(同時に複数立てられる)"
run = '''
#!/usr/bin/env bash
set -euo pipefail
STACK_NAME="${BASTION_STACK_NAME}-$(date +%Y%m%d%H%M%S)"
# CIDR形式にする必要があるため/32を付与
MY_IP="$(curl -s https://checkip.amazonaws.com)/32"
aws cloudformation deploy \
  --stack-name "$STACK_NAME" \
  --template-file cloudformation.yaml \
  --parameter-overrides MyIp="$MY_IP" InstanceType="t4g.small" RootVolumeSize="20" \
  --capabilities CAPABILITY_IAM
'''

[tasks.down-bastion]
description = "bastion stackを一覧から選んで削除"
interactive = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
STACK_NAME="$(aws cloudformation describe-stacks \
  --query "Stacks[?starts_with(StackName, '${BASTION_STACK_NAME}')].StackName" --output text | tr '\t' '\n' | fzf)"
if [ -z "$STACK_NAME" ]; then
  echo "選択されませんでした" >&2
  exit 1
fi
aws cloudformation delete-stack --stack-name "$STACK_NAME"
aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
'''

[tasks.down-bastion-all]
description = "aws-bastionで始まる全stackを削除"
run = '''
#!/usr/bin/env bash
set -euo pipefail
STACK_NAMES="$(aws cloudformation describe-stacks \
  --query "Stacks[?starts_with(StackName, '${BASTION_STACK_NAME}')].StackName" --output text)"
for STACK_NAME in $STACK_NAMES; do
  aws cloudformation delete-stack --stack-name "$STACK_NAME"
done
for STACK_NAME in $STACK_NAMES; do
  aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
done
'''

[tasks.status]
description = "aws-bastionで始まる全stackとEC2の状態を確認"
run = '''
#!/usr/bin/env bash
set -euo pipefail
STACK_NAMES="$(aws cloudformation describe-stacks \
  --query "Stacks[?starts_with(StackName, '${BASTION_STACK_NAME}')].StackName" --output text)"
for STACK_NAME in $STACK_NAMES; do
  echo "=== $STACK_NAME ==="
  aws cloudformation describe-stacks \
    --stack-name "$STACK_NAME" \
    --query "Stacks[0].StackStatus" --output text
  aws ec2 describe-instances \
    --filters "Name=tag:aws:cloudformation:stack-name,Values=$STACK_NAME" "Name=instance-state-name,Values=pending,running,stopping,stopped" \
    --query "Reservations[].Instances[].{ID:InstanceId,State:State.Name,Type:InstanceType,PublicIp:PublicIpAddress}" \
    --output table

  INSTANCE_ID="$(aws cloudformation describe-stacks \
    --stack-name "$STACK_NAME" \
    --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" --output text)"
  COMMAND_ID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name "AWS-RunShellScript" --parameters commands="cloud-init status" --query "Command.CommandId" --output text 2>/dev/null)" || true
  if [ -n "${COMMAND_ID:-}" ]; then
    while [ "$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null)" = "InProgress" ]; do
      sleep 1
    done
    aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text 2>/dev/null
  else
    echo "status: unknown(SSM未接続)"
  fi
done
'''

[tasks.ping]
description = "aws-bastionで始まる全stackにSSM経由でechoコマンドを送りpongを確認"
run = '''
#!/usr/bin/env bash
set -euo pipefail
STACK_NAMES="$(aws cloudformation describe-stacks \
  --query "Stacks[?starts_with(StackName, '${BASTION_STACK_NAME}')].StackName" --output text)"
for STACK_NAME in $STACK_NAMES; do
  INSTANCE_ID="$(aws cloudformation describe-stacks \
    --stack-name "$STACK_NAME" \
    --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" --output text)"
  COMMAND_ID="$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name "AWS-RunShellScript" --parameters commands="echo pong" --query "Command.CommandId" --output text)"
  while [ "$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query Status --output text)" = "InProgress" ]; do
    sleep 1
  done
  OUTPUT="$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query StandardOutputContent --output text)"
  echo "$STACK_NAME ($INSTANCE_ID): $OUTPUT"
done
'''

[tasks.connect]
description = "bastion stackを一覧から選びSSM Session Managerでubuntuユーザーに入る(デバッグ用)"
interactive = true
run = '''
#!/usr/bin/env bash
set -euo pipefail
STACK_NAME="$(aws cloudformation describe-stacks \
  --query "Stacks[?starts_with(StackName, '${BASTION_STACK_NAME}')].StackName" --output text | tr '\t' '\n' | fzf)"
if [ -z "$STACK_NAME" ]; then
  echo "選択されませんでした" >&2
  exit 1
fi
INSTANCE_ID="$(aws cloudformation describe-stacks \
  --stack-name "$STACK_NAME" \
  --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" --output text)"
aws ssm start-session --target "$INSTANCE_ID" \
  --document-name AWS-StartInteractiveCommand \
  --parameters command="sudo su - ubuntu"
'''

# docker: mvdan/shfmtは作者製
# https://hub.docker.com/r/mvdan/shfmt/dockerfile
[tasks.fmt-sh]
description = "scripts/以下をformat"
run = '''
#!/usr/bin/env bash
set -euo pipefail
docker run --rm -it -u "$(id -u):$(id -g)" --mount type=bind,source="${PWD}/scripts/",target=/scripts/ -w /scripts mvdan/shfmt:v3.13.1 -i 2 -w .
'''

# docker: koalaman/shellcheck は作者製
# https://hub.docker.com/r/koalaman/shellcheck
[tasks.lint-sh]
description = "scripts/以下をlint"
run = '''
#!/usr/bin/env bash
set -euo pipefail
SH_FILES=$(ls -1 scripts/*.sh | xargs -n1 basename)
docker run --rm -it -u "$(id -u):$(id -g)" --mount type=bind,source="${PWD}/scripts/",target=/scripts/ -w /scripts koalaman/shellcheck:v0.11.0 $SH_FILES
'''
